<style>
/* ══ VARIABLES — green dark */
:root {
  --bg:#071510;--bg2:#0a1c16;--card:#0d2118;--card2:#102a1e;
  --fg:#c8ddd5;--fg2:#7aaa90;--fg3:#3d6650;
  --primary:#2dbd7e;--primary2:#1a9962;--accent:#2dbd7e;--red:#f87171;--yellow:#fbbf24;
  --border:rgba(45,189,126,0.08);--border2:rgba(45,189,126,0.16);
  --glow:0 0 40px rgba(45,189,126,0.18);--shadow:0 8px 32px rgba(0,0,0,0.5);
  --r:0px;
  --ff-mono:'Space Mono',monospace;--ff-disp:'Bebas Neue',sans-serif;--ff-body:'DM Sans',sans-serif;
  --j-key:#7eb3ff;--j-str:#a8e6a3;--j-num:#ffb86c;--j-bool:#f883d9;--j-null:#f87171;--j-punc:#3d6650;
  --post-bg:rgba(58,143,212,0.12);--post-c:#3a8fd4;--post-b:rgba(58,143,212,0.25);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--fg);font-family:var(--ff-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;min-height:100vh;}

/* Grid Background */
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(45,189,126,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(45,189,126,0.03) 1px,transparent 1px);
  background-size:48px 48px;}

/* Orbs */
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
.orb-1{width:500px;height:500px;background:rgba(45,189,126,0.07);top:-100px;right:-100px;}
.orb-2{width:400px;height:400px;background:rgba(45,189,126,0.04);bottom:20%;left:-80px;}

/* Loader */
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s,visibility .4s;gap:14px;}
#loader.out{opacity:0;visibility:hidden;pointer-events:none;}
.loader-ring{width:36px;height:36px;border:2px solid var(--border2);border-top-color:var(--primary);border-radius:50%;animation:spin .9s linear infinite;}
.loader-text{font-family:var(--ff-mono);font-size:10px;color:var(--fg3);letter-spacing:3px;text-transform:uppercase;}

@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.6}}

/* Header */
header{position:sticky;top:0;z-index:200;background:rgba(7,21,16,0.88);backdrop-filter:blur(18px) saturate(180%);border-bottom:1px solid var(--border2);}
.header-inner{max-width:1200px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:var(--ff-mono);font-size:13px;font-weight:700;color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:10px;}
.logo-dot{width:8px;height:8px;background:var(--primary);border-radius:50%;animation:pulseDot 2s ease infinite;}
.logo-badge{font-size:9px;font-weight:700;background:var(--primary2);color:#fff;padding:2px 8px;letter-spacing:1px;border-radius:6px;}
.nav-row{display:flex;align-items:center;gap:6px;}
.nav-pill{font-family:var(--ff-mono);font-size:9px;font-weight:700;color:var(--fg3);letter-spacing:1px;padding:4px 11px;border:1px solid var(--border2);border-radius:8px;background:var(--card2);text-decoration:none;transition:all .2s;}
.nav-pill:hover{color:var(--fg);border-color:var(--fg3);}

/* Sidebar */
#sidebar{
  position:fixed;top:0;left:0;height:100%;width:260px;
  background:var(--card);border-right:1px solid var(--border2);
  z-index:100;display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
#sidebar.open{transform:translateX(0);}
#sidebar .sidebar-header{padding:24px 24px 20px;border-bottom:1px solid var(--border2);}
#sidebar .sidebar-header h1{font-family:var(--ff-disp);font-size:22px;color:var(--fg);letter-spacing:2px;}
#sidebar .sidebar-header p{font-family:var(--ff-mono);font-size:9px;color:var(--fg3);margin-top:4px;}
#sidebar nav{padding:20px 0;flex:1;overflow-y:auto;}
#sidebar nav .nav-title{font-family:var(--ff-mono);font-size:9px;letter-spacing:2px;color:var(--fg3);padding:0 20px 12px;text-transform:uppercase;}
#sidebar nav a{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;font-size:13px;color:var(--fg2);text-decoration:none;transition:all .2s;border-left:2px solid transparent;}
#sidebar nav a:hover{background:rgba(45,189,126,0.05);color:var(--fg);}
#sidebar nav a.active{background:rgba(45,189,126,0.08);border-left-color:var(--primary);color:var(--primary);}
#sidebar nav a .count{font-family:var(--ff-mono);font-size:9px;color:var(--fg3);}
#sidebar .sidebar-footer{padding:20px;border-top:1px solid var(--border2);font-family:var(--ff-mono);font-size:9px;color:var(--fg3);text-align:center;}

/* Overlay */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:90;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;backdrop-filter:blur(4px);}
#overlay.show{opacity:1;visibility:visible;}

/* Main Content */
.main-content{padding-left:0;transition:padding-left .3s;}
@media (min-width:768px){
  body{padding-left:260px;}
  #sidebar{transform:translateX(0);}
  #overlay{display:none;}
  #menuToggle{display:none;}
}
.main-wrap{max-width:1000px;margin:0 auto;padding:24px 24px 60px;position:relative;z-index:10;}

/* Menu Toggle (≡) */
#menuToggle{background:var(--card);border:1px solid var(--border2);padding:8px 12px;cursor:pointer;color:var(--fg);font-family:var(--ff-mono);font-size:18px;font-weight:700;}

/* Banner */
.banner-wrap{border:1px solid var(--border2);margin-bottom:24px;background:var(--card);}
.banner-wrap img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;}

/* Terminal Search */
.terminal-box{border:1px solid var(--border2);overflow:hidden;margin-bottom:28px;}
.terminal-bar{background:var(--card2);padding:10px 16px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:8px;}
.terminal-dot{width:10px;height:10px;border-radius:50%;background:#ff5f56;}
.terminal-dot:nth-child(2){background:#ffbd2e;}
.terminal-dot:nth-child(3){background:#27c93f;}
.terminal-bar span{font-family:var(--ff-mono);font-size:9px;color:var(--fg3);margin-left:8px;}
.terminal-input{background:var(--bg2);padding:12px 16px;display:flex;align-items:center;gap:10px;}
.terminal-input .prompt{font-family:var(--ff-mono);font-size:12px;color:var(--primary);}
.terminal-input input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font-family:var(--ff-mono);font-size:12px;}
.terminal-input input::placeholder{color:var(--fg3);}

/* Card */
.card{background:var(--card);border:1px solid var(--border2);margin-bottom:10px;overflow:hidden;transition:all .2s;}
.card:hover{border-color:rgba(45,189,126,0.3);}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;background:var(--card);transition:background .2s;}
.card-header:hover{background:var(--card2);}
.card-header-left{display:flex;align-items:center;gap:8px;flex:1;}
.card-header-left .material-icons{color:var(--primary);font-size:18px;transition:transform .2s;}
.card-header-left .material-icons.rotated{transform:rotate(180deg);}
.card-header-left h3{font-size:12px;font-weight:500;color:var(--fg);}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
.tag{font-family:var(--ff-mono);font-size:7px;padding:2px 6px;background:var(--bg2);border:1px solid var(--border2);color:var(--fg3);letter-spacing:0.5px;}
.badge-method{font-family:var(--ff-mono);font-size:8px;font-weight:700;padding:3px 8px;flex-shrink:0;}
.badge-get{background:rgba(45,189,126,0.12);color:var(--primary);border:1px solid rgba(45,189,126,0.25);}
.badge-post{background:var(--post-bg);color:var(--post-c);border:1px solid var(--post-b);}
.menu-dots{color:var(--fg3);cursor:pointer;padding:4px;border-radius:4px;transition:all .2s;}
.menu-dots:hover{background:var(--bg2);color:var(--fg);}
.card-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border2);background:var(--card);}

/* Tab Methods */
.tab-container{display:flex;gap:0;border-bottom:1px solid var(--border2);margin-bottom:14px;}
.tab-btn{padding:8px 14px;font-family:var(--ff-mono);font-size:10px;font-weight:700;color:var(--fg3);background:transparent;border:none;cursor:pointer;transition:all .2s;position:relative;}
.tab-btn.active{color:var(--primary);}
.tab-btn.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--primary);}
.method-content{display:none;}
.method-content.active{display:block;}

/* Form Elements */
.param-group{margin-bottom:10px;}
.param-group label{display:block;font-family:var(--ff-mono);font-size:8px;font-weight:700;color:var(--fg2);margin-bottom:3px;text-transform:uppercase;}
.param-group input,.param-group select,.param-group textarea{width:100%;background:var(--bg2);border:1px solid var(--border2);padding:7px 9px;color:var(--fg);font-family:var(--ff-mono);font-size:9px;outline:none;transition:all .2s;}
.param-group input:focus,.param-group select:focus,.param-group textarea:focus{border-color:var(--primary);}
.param-group input::placeholder{color:var(--fg3);}
.param-group .desc{font-family:var(--ff-mono);font-size:7px;color:var(--fg3);margin-top:2px;}
.btn-execute{width:100%;background:var(--primary);border:none;padding:8px;color:#fff;font-family:var(--ff-mono);font-size:9px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px;margin-top:5px;}
.btn-execute:hover{background:var(--primary2);box-shadow:var(--glow);}
.button-group{display:flex;gap:8px;margin-top:10px;}
.button-group button{flex:1;}

/* Status Code Table di dalam card */
.status-table-card{border:1px solid var(--border2);overflow:hidden;margin-top:14px;}
.status-table-header-card{background:var(--card2);padding:8px 12px;border-bottom:1px solid var(--border2);}
.status-table-header-card span{font-family:var(--ff-mono);font-size:8px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:1px;}
.status-table-card table{width:100%;border-collapse:collapse;}
.status-table-card th,.status-table-card td{padding:6px 10px;text-align:left;font-family:var(--ff-mono);font-size:8px;border-bottom:1px solid var(--border2);}
.status-table-card th{color:var(--fg3);font-weight:500;background:rgba(0,0,0,0.2);}
.status-table-card td{color:var(--fg2);}
.status-table-card tr:last-child td{border-bottom:none;}
.status-icon{font-size:12px;vertical-align:middle;margin-right:4px;}
.status-icon.ok{color:var(--primary);}
.status-icon.err{color:var(--red);}
.status-icon.warning{color:var(--yellow);}

/* Response Section dengan warna JSON */
.response-section{margin-top:14px;}
.response-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.response-status{font-family:var(--ff-mono);font-size:8px;padding:3px 8px;}
.response-status.ok{background:rgba(45,189,126,0.1);color:var(--primary);border:1px solid rgba(45,189,126,0.2);}
.response-status.err{background:rgba(248,113,113,0.1);color:var(--red);border:1px solid rgba(248,113,113,0.2);}
.response-timing{font-family:var(--ff-mono);font-size:7px;color:var(--fg3);background:var(--bg2);border:1px solid var(--border2);padding:3px 7px;}
.response-copy{font-family:var(--ff-mono);font-size:7px;color:var(--fg3);background:var(--bg2);border:1px solid var(--border2);padding:3px 8px;cursor:pointer;}
.response-box{background:var(--bg2);border:1px solid var(--border2);overflow:hidden;}
.response-box-header{padding:7px 10px;border-bottom:1px solid var(--border2);font-family:var(--ff-mono);font-size:7px;color:var(--fg3);text-transform:uppercase;}
.response-content{padding:10px;font-family:var(--ff-mono);font-size:9px;overflow-x:auto;max-height:250px;overflow-y:auto;}
.response-content pre{margin:0;white-space:pre-wrap;word-break:break-all;}
.response-content img{max-width:100%;border-radius:4px;margin-top:8px;}
/* Warna JSON */
.j-key{color:#7eb3ff;}.j-str{color:#a8e6a3;}.j-num{color:#ffb86c;}.j-bool{color:#f883d9;}.j-null{color:#f87171;}.j-punc{color:#3d6650;}

/* Code Block */
.code-block{background:var(--bg2);border:1px solid var(--border2);margin-top:10px;overflow:hidden;}
.code-header{padding:7px 10px;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center;}
.code-header span{font-family:var(--ff-mono);font-size:7px;color:var(--fg3);text-transform:uppercase;}
.code-copy{font-family:var(--ff-mono);font-size:7px;color:var(--fg3);background:none;border:none;cursor:pointer;}
.code-pre{padding:10px;font-family:var(--ff-mono);font-size:8px;white-space:pre-wrap;overflow-x:auto;line-height:1.4;}

/* Footer */
hr.sep{border:none;border-top:1px solid var(--border2);max-width:1000px;margin:0 auto;}
footer{background:var(--card);border-top:1px solid var(--border2);margin-top:20px;}
.footer-inner{max-width:1000px;margin:0 auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.footer-brand{font-family:var(--ff-disp);font-size:20px;color:var(--fg);letter-spacing:2px;}
.footer-copy{font-family:var(--ff-mono);font-size:9px;color:var(--fg3);}
.footer-copy a{color:var(--primary);text-decoration:none;}
.footer-copy a:hover{text-decoration:underline;}

/* No Results */
#noResults{display:none;text-align:center;padding:48px 24px;}
</style>
</head>

<script>
let endpointsDataGlobal = [];
let categoriesMap = new Map();
let currentCategory = 'all';
let currentResponse = null;

function tokenizeJSON(v, d) {
  d = d || 0;
  if (v === null) return '<span class="j-null">null</span>';
  if (typeof v === 'boolean') return '<span class="j-bool">' + v + '</span>';
  if (typeof v === 'number') return '<span class="j-num">' + v + '</span>';
  if (typeof v === 'string') return '<span class="j-str">"' + esc(v) + '"</span>';
  if (Array.isArray(v)) {
    if (!v.length) return '<span class="j-punc">[]</span>';
    const ind = '  '.repeat(d + 1);
    const items = v.map(function(x) { return ind + tokenizeJSON(x, d + 1); });
    return '<span class="j-punc">[</span>\n' + items.join('<span class="j-punc">,</span>\n') + '\n' + '  '.repeat(d) + '<span class="j-punc">]</span>';
  }
  const keys = Object.keys(v);
  if (!keys.length) return '<span class="j-punc">{}</span>';
  const ind = '  '.repeat(d + 1);
  const items = keys.map(function(k) {
    return ind + '<span class="j-key">"' + esc(k) + '"</span><span class="j-punc">: </span>' + tokenizeJSON(v[k], d + 1);
  });
  return '<span class="j-punc">{</span>\n' + items.join('<span class="j-punc">,</span>\n') + '\n' + '  '.repeat(d) + '<span class="j-punc">}</span>';
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function extractParamsFromPath(path) {
  const params = [];
  const queryStart = path.indexOf('?');
  if (queryStart !== -1) {
    const queryString = path.slice(queryStart + 1);
    const pairs = queryString.split('&');
    pairs.forEach(pair => {
      const eqIndex = pair.indexOf('=');
      if (eqIndex !== -1) params.push(pair.slice(0, eqIndex));
      else if (pair) params.push(pair);
    });
  }
  return params;
}

function convertEndpointData(rawData) {
  const result = [];
  categoriesMap.clear();
  const categories = rawData.endpoints || rawData;
  
  categories.forEach(cat => {
    const categoryName = cat.name || "Uncategorized";
    if (!categoriesMap.has(categoryName)) categoriesMap.set(categoryName, []);
    if (cat.items && cat.items.length) {
      cat.items.forEach(item => {
        const isPost = item.post === true;
        const paramsFromPath = extractParamsFromPath(item.path);
        const hasFileUpload = item.paramsFile && item.paramsFile.length;
        let parameters = { required: [], optional: [] };
        if (item.params && item.params.length) {
          item.params.forEach(p => {
            const paramName = p.replace(/=$/, '');
            parameters.required.push({ name: paramName, description: item.desc || `Enter ${paramName}`, example: `your_${paramName}_here` });
          });
        } else if (paramsFromPath.length) {
          paramsFromPath.forEach(paramName => {
            parameters.required.push({ name: paramName, description: item.desc || `Enter ${paramName}`, example: `your_${paramName}_here` });
          });
        }
        let alias = item.path.split('?')[0].split('/').pop();
        if (alias === 'v1' || alias === 'v2' || alias === 'v3') {
          const parent = item.path.split('/').slice(-2, -1)[0];
          alias = parent ? `${parent} ${alias}` : alias;
        }
        alias = alias.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        const endpointObj = {
          id: result.length, alias: alias, method: isPost ? "POST" : "GET",
          methods: [isPost ? "POST" : "GET"], path: item.path.split('?')[0],
          category: categoryName, tags: [categoryName, isPost ? "Upload" : "Download"],
          parameters: parameters, hasFileUpload: hasFileUpload, originalDesc: item.desc, rawPath: item.path
        };
        result.push(endpointObj);
        categoriesMap.get(categoryName).push(endpointObj);
      });
    }
  });
  return result;
}

function renderSidebarCategories() {
  const container = document.getElementById('category-list');
  document.getElementById('count-all').textContent = endpointsDataGlobal.length;
  let html = '';
  for (let [catName, items] of categoriesMap) {
    if (catName !== "Uncategorized") {
      html += `<a href="#" data-category="${esc(catName)}">${esc(catName)} <span class="count">${items.length}</span></a>`;
    }
  }
  container.innerHTML = html;
  document.querySelectorAll('#sidebar-nav a[data-category]').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      currentCategory = link.getAttribute('data-category');
      document.querySelectorAll('#sidebar-nav a').forEach(a => a.classList.remove('active'));
      link.classList.add('active');
      if (currentCategory === 'all') renderEndpoints('');
      else renderFilteredEndpoints(endpointsDataGlobal.filter(ep => ep.category === currentCategory));
    });
  });
}

function renderFilteredEndpoints(endpoints) {
  const container = document.getElementById('ep-list');
  const noResults = document.getElementById('noResults');
  if (endpoints.length === 0) { container.innerHTML = ''; noResults.style.display = 'block'; return; }
  noResults.style.display = 'none';
  container.innerHTML = endpoints.map(ep => `
    <div class="card">
      <div class="card-header" onclick="toggleCard(${ep.id})">
        <div class="card-header-left">
          <span class="material-icons" id="card-icon-${ep.id}">expand_more</span>
          <div><h3>${esc(ep.alias)}</h3><div class="tags">${ep.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="badge-method ${ep.method === 'GET' ? 'badge-get' : 'badge-post'}">${ep.method}</span>
          <span class="material-icons menu-dots" onclick="event.stopPropagation();showEndpointMenu('${ep.path}')">more_vert</span>
        </div>
      </div>
      <div class="card-body" id="card-body-${ep.id}">
        <div class="tab-container">${ep.methods.map(m => `<button class="tab-btn ${m === ep.method ? 'active' : ''}" onclick="switchMethod(${ep.id}, '${m}')">${m}</button>`).join('')}</div>
        <div id="method-content-${ep.id}" class="method-content active">
          ${ep.parameters?.required?.map(p => `<div class="param-group"><label>${esc(p.name)}</label><input type="text" name="${esc(p.name)}" placeholder="${esc(p.example || '')}" value="${esc(p.example || '')}" oninput="updateCurl(${ep.id})"><div class="desc">${esc(p.description || '')}</div></div>`).join('')}
          ${ep.hasFileUpload ? `<div class="param-group"><label>File Upload</label><input type="file" name="file" onchange="updateCurl(${ep.id})"><div class="desc">Upload image/file for processing</div></div>` : ''}
        </div>
        <div class="button-group"><button class="btn-execute" onclick="executeRequest(${ep.id})"><span class="material-icons" style="font-size:10px;">play_arrow</span> EXECUTE</button><button class="btn-execute" style="background:var(--card2);color:var(--fg2);" onclick="clearResponse(${ep.id})"><span class="material-icons" style="font-size:10px;">clear</span> CLEAR</button></div>
        <div class="response-section" id="response-${ep.id}" style="display:none;"><div class="response-header"><span class="response-status ok" id="resp-status-${ep.id}">200 OK</span><span class="response-timing" id="resp-time-${ep.id}">—ms</span><button class="response-copy" onclick="copyResponse(${ep.id})">Copy</button></div><div class="response-box"><div class="response-box-header">Response</div><div class="response-content" id="resp-content-${ep.id}"><pre>Send a request...</pre></div></div></div>
        <div class="code-block"><div class="code-header"><span>cURL</span><button class="code-copy" onclick="copyCurl(${ep.id})">copy</button></div><div class="code-pre" id="curl-pre-${ep.id}">curl -X GET "${window.location.origin}${ep.path}"</div></div>
        ${statusCodesHTML}
      </div>
    </div>
  `).join('');
  endpointsDataGlobal.forEach(ep => updateCurl(ep.id));
}

const statusCodesHTML = `<div class="status-table-card"><div class="status-table-header-card"><span>📋 HTTP Status Codes</span></div><table><thead><tr><th>Code</th><th>Description</th></tr></thead><tbody><tr><td><span class="material-icons status-icon ok" style="font-size:12px;">check_circle</span> 200</td><td>OK - Request successful</td></tr><tr><td><span class="material-icons status-icon err" style="font-size:12px;">error</span> 400</td><td>Bad Request - Invalid parameters or missing required fields</td></tr><tr><td><span class="material-icons status-icon err" style="font-size:12px;">error</span> 401</td><td>Unauthorized - Missing or invalid API key</td></tr><tr><td><span class="material-icons status-icon err" style="font-size:12px;">error</span> 403</td><td>Forbidden - You do not have permission to access this resource</td></tr><tr><td><span class="material-icons status-icon err" style="font-size:12px;">error</span> 404</td><td>Not Found - The requested resource could not be found</td></tr><tr><td><span class="material-icons status-icon err" style="font-size:12px;">error</span> 405</td><td>Method Not Allowed - HTTP method not supported for this resource</td></tr><tr><td><span class="material-icons status-icon warning" style="font-size:12px;">warning</span> 429</td><td>Too Many Requests - You have hit the rate limit</td></tr><tr><td><span class="material-icons status-icon err" style="font-size:12px;">error</span> 500</td><td>Internal Server Error - Something went wrong on our end</td></tr><tr><td><span class="material-icons status-icon err" style="font-size:12px;">error</span> 503</td><td>Service Unavailable - The server is temporarily unavailable</td></tr></tbody></table></div>`;

function renderEndpoints(filter = '') {
  const searchTerm = filter.toLowerCase();
  let filtered = endpointsDataGlobal;
  if (searchTerm) filtered = endpointsDataGlobal.filter(ep => ep.alias.toLowerCase().includes(searchTerm) || ep.path.toLowerCase().includes(searchTerm) || ep.tags.some(t => t.toLowerCase().includes(searchTerm)));
  if (currentCategory !== 'all') filtered = filtered.filter(ep => ep.category === currentCategory);
  renderFilteredEndpoints(filtered);
}

function showEndpointMenu(path) {
  removeMenu();
  const div = document.createElement('div');
  div.innerHTML = `<div id="temp-menu" style="position:fixed;background:var(--card2);border:1px solid var(--border2);z-index:200;min-width:150px;"><div style="padding:8px 12px;font-family:var(--ff-mono);font-size:10px;color:var(--fg3);border-bottom:1px solid var(--border2);">Options</div><div style="padding:8px 12px;cursor:pointer;color:var(--fg2);" onclick="copyEndpointLink('${path}');removeMenu()">🔗 Copy Link</div><div style="padding:8px 12px;cursor:pointer;color:var(--fg2);" onclick="copyFullUrl('${path}');removeMenu()">📋 Copy Full URL</div><div style="padding:8px 12px;cursor:pointer;color:var(--fg2);" onclick="removeMenu()">✖ Close</div></div>`;
  document.body.appendChild(div.firstChild);
  const menu = document.getElementById('temp-menu');
  if (menu) { menu.style.top = (window.event?.clientY || 100) + 'px'; menu.style.left = (window.event?.clientX || 100) + 'px'; }
  setTimeout(() => { document.addEventListener('click', function removeHandler(e) { if (menu && !menu.contains(e.target)) { removeMenu(); document.removeEventListener('click', removeHandler); } }); }, 100);
}

function removeMenu() { const existing = document.getElementById('temp-menu'); if (existing) existing.remove(); }
function copyEndpointLink(path) { navigator.clipboard.writeText(window.location.origin + path); }
function copyFullUrl(path) { navigator.clipboard.writeText(window.location.origin + path); }
function toggleCard(idx) { const body = document.getElementById(`card-body-${idx}`); const icon = document.getElementById(`card-icon-${idx}`); if (body.style.display === 'none' || !body.style.display) { body.style.display = 'block'; icon.classList.remove('rotated'); } else { body.style.display = 'none'; icon.classList.add('rotated'); } }
function switchMethod(idx, method) { updateCurl(idx); }
function buildCurl(idx) {
  const ep = endpointsDataGlobal.find(e => e.id === idx); if (!ep) return '';
  let url = window.location.origin + ep.path;
  if (ep.method === 'GET') {
    const params = []; document.querySelectorAll(`#card-body-${idx} input[type="text"]`).forEach(i => { if (i.value) params.push(`${encodeURIComponent(i.name)}=${encodeURIComponent(i.value)}`); });
    if (params.length) url += '?' + params.join('&');
    return `curl -X GET "${url}"`;
  } else {
    const bodyObj = {}; document.querySelectorAll(`#card-body-${idx} input[type="text"]`).forEach(i => { if (i.value) bodyObj[i.name] = i.value; });
    const fileInput = document.querySelector(`#card-body-${idx} input[type="file"]`);
    if (fileInput && fileInput.files && fileInput.files[0]) return `curl -X POST "${url}" \\\n  -F "image=@${fileInput.files[0].name}"`;
    else if (Object.keys(bodyObj).length) return `curl -X POST "${url}" \\\n  -H "Content-Type: application/json" \\\n  -d '${JSON.stringify(bodyObj)}'`;
    else return `curl -X POST "${url}"`;
  }
}
function updateCurl(idx) { const el = document.getElementById(`curl-pre-${idx}`); if (el) el.textContent = buildCurl(idx); }
function copyCurl(idx) { const el = document.getElementById(`curl-pre-${idx}`); if (el) { navigator.clipboard.writeText(el.textContent); const btn = el.parentElement.querySelector('.code-copy'); const orig = btn.textContent; btn.textContent = '✓'; setTimeout(() => btn.textContent = orig, 1500); } }
function copyResponse(idx) { if (currentResponse) { navigator.clipboard.writeText(JSON.stringify(currentResponse, null, 2)); const btn = document.querySelector(`#response-${idx} .response-copy`); const orig = btn.textContent; btn.textContent = '✓'; setTimeout(() => btn.textContent = orig, 1500); } }
function clearResponse(idx) { const sec = document.getElementById(`response-${idx}`); if (sec) sec.style.display = 'none'; currentResponse = null; }

async function executeRequest(idx) {
  const ep = endpointsDataGlobal.find(e => e.id === idx); if (!ep) return;
  let url = window.location.origin + ep.path;
  const start = Date.now();
  const sec = document.getElementById(`response-${idx}`), cont = document.getElementById(`resp-content-${idx}`), stat = document.getElementById(`resp-status-${idx}`), tim = document.getElementById(`resp-time-${idx}`);
  cont.innerHTML = '<pre>Loading...</pre>'; sec.style.display = 'block';
  try {
    let response;
    if (ep.method === 'GET') {
      const params = []; document.querySelectorAll(`#card-body-${idx} input[type="text"]`).forEach(i => { if (i.value) params.push(`${encodeURIComponent(i.name)}=${encodeURIComponent(i.value)}`); });
      if (params.length) url += '?' + params.join('&');
      response = await fetch(url);
    } else {
      const fileInput = document.querySelector(`#card-body-${idx} input[type="file"]`);
      if (fileInput && fileInput.files && fileInput.files[0]) {
        const fd = new FormData(); fd.append('image', fileInput.files[0]);
        response = await fetch(url, { method: 'POST', body: fd });
      } else {
        const bodyObj = {}; document.querySelectorAll(`#card-body-${idx} input[type="text"]`).forEach(i => { if (i.value) bodyObj[i.name] = i.value; });
        response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: Object.keys(bodyObj).length ? JSON.stringify(bodyObj) : undefined });
      }
    }
    const ms = Date.now() - start;
    const isOk = response.ok;
    const ct = response.headers.get('content-type');
    if (ct && (ct.includes('image/') || ct.includes('video/') || ct.includes('audio/') || ct.includes('application/pdf'))) {
      const blob = await response.blob(); const objUrl = URL.createObjectURL(blob);
      currentResponse = { media: true, type: ct, url: objUrl };
      if (ct.includes('image/')) cont.innerHTML = `<img src="${objUrl}" style="max-width:100%;border-radius:4px;"/>`;
      else if (ct.includes('video/')) cont.innerHTML = `<video controls style="max-width:100%;border-radius:4px;"><source src="${objUrl}" type="${ct}"></video>`;
      else if (ct.includes('audio/')) cont.innerHTML = `<audio controls style="width:100%;"><source src="${objUrl}" type="${ct}"></audio>`;
      else cont.innerHTML = `<iframe src="${objUrl}" style="width:100%;height:300px;border:none;"></iframe>`;
    } else if (ct && ct.includes('application/json')) {
      const data = await response.json(); currentResponse = data;
      const coloredJSON = tokenizeJSON(data, 0);
      cont.innerHTML = `<pre style="margin:0;white-space:pre-wrap;">${coloredJSON}</pre>`;
    } else {
      const data = await response.text(); currentResponse = data;
      cont.innerHTML = `<pre>${esc(data)}</pre>`;
    }
    stat.textContent = `${response.status} ${response.statusText}`;
    stat.className = `response-status ${isOk ? 'ok' : 'err'}`;
    tim.textContent = `${ms}ms`;
    updateCurl(idx);
  } catch (error) {
    stat.textContent = '500 Error'; stat.className = 'response-status err';
    tim.textContent = `${Date.now() - start}ms`;
    cont.innerHTML = `<pre>Error: ${esc(error.message)}</pre>`;
  }
}

function setupSearch() { document.getElementById('searchInput')?.addEventListener('input', (e) => renderEndpoints(e.target.value)); }

async function loadEndpoints() {
  try {
    const response = await fetch('/endpoint');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    endpointsDataGlobal = convertEndpointData(data);
    renderSidebarCategories();
    renderEndpoints('');
  } catch (error) {
    console.error('Gagal load /endpoint:', error);
    document.getElementById('ep-list').innerHTML = `<div class="card" style="padding:40px;text-align:center;color:var(--red);border-color:var(--red)"><div>❌ Gagal memuat endpoint</div><div style="font-size:11px;margin-top:12px;">${esc(error.message)}</div><div style="font-size:10px;margin-top:8px;color:var(--fg3)">Pastikan server menyediakan /endpoint</div></div>`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadEndpoints(); setupSearch();
  const sidebar = document.getElementById('sidebar'), overlay = document.getElementById('overlay'), menuToggle = document.getElementById('menuToggle');
  if (menuToggle) menuToggle.addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('show'); });
  if (overlay) overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); });
  setTimeout(() => { const loader = document.getElementById('loader'); if (loader) loader.classList.add('out'); }, 500);
});

window.toggleCard = toggleCard; window.switchMethod = switchMethod; window.executeRequest = executeRequest; window.clearResponse = clearResponse;
window.updateCurl = updateCurl; window.copyCurl = copyCurl; window.copyResponse = copyResponse; window.showEndpointMenu = showEndpointMenu;
window.copyEndpointLink = copyEndpointLink; window.copyFullUrl = copyFullUrl; window.removeMenu = removeMenu;
</script>
</body>
</html>

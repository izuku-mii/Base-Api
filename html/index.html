<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BASE-SIMPLE — Downloader API</title>

<!-- Favicon -->
<link rel="icon" type="image/jpeg" href="/assets/icon.jpg"/>
<link rel="apple-touch-icon" href="/assets/icon-bg.jpg"/>

<!-- Meta Tags -->
<meta name="description" content="API Downloader services supporting various platforms including YouTube, TikTok, Instagram, and more."/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="BASE-SIMPLE — Downloader API"/>
<meta property="og:description" content="API Downloader services supporting various platforms including YouTube, TikTok, Instagram, and more."/>
<meta property="og:image" content="/assets/banner.jpg"/>
<meta property="og:image:width" content="1280"/>
<meta property="og:image:height" content="720"/>
<meta name="twitter:card" content="summary_large_image"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
/* ══ VARIABLES — green dark */
:root {
  --bg:#071510;--bg2:#0a1c16;--card:#0d2118;--card2:#102a1e;
  --fg:#c8ddd5;--fg2:#7aaa90;--fg3:#3d6650;
  --primary:#2dbd7e;--primary2:#1a9962;--accent:#2dbd7e;--red:#f87171;
  --border:rgba(45,189,126,0.08);--border2:rgba(45,189,126,0.16);
  --glow:0 0 40px rgba(45,189,126,0.18);--shadow:0 8px 32px rgba(0,0,0,0.5);
  --r:0px;
  --ff-mono:'Space Mono',monospace;--ff-disp:'Bebas Neue',sans-serif;--ff-body:'DM Sans',sans-serif;
  --j-key:#7eb3ff;--j-str:#a8e6a3;--j-num:#ffb86c;--j-bool:#f883d9;--j-null:#f87171;--j-punc:#3d6650;
  --post-bg:rgba(58,143,212,0.12);--post-c:#3a8fd4;--post-b:rgba(58,143,212,0.25);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--fg);font-family:var(--ff-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;min-height:100vh;}

/* Grid Background */
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(45,189,126,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(45,189,126,0.03) 1px,transparent 1px);
  background-size:48px 48px;}

/* Orbs */
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
.orb-1{width:500px;height:500px;background:rgba(45,189,126,0.07);top:-100px;right:-100px;}
.orb-2{width:400px;height:400px;background:rgba(45,189,126,0.04);bottom:20%;left:-80px;}

/* Loader */
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s,visibility .4s;gap:14px;}
#loader.out{opacity:0;visibility:hidden;pointer-events:none;}
.loader-ring{width:36px;height:36px;border:2px solid var(--border2);border-top-color:var(--primary);border-radius:50%;animation:spin .9s linear infinite;}
.loader-text{font-family:var(--ff-mono);font-size:10px;color:var(--fg3);letter-spacing:3px;text-transform:uppercase;}

@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.6}}
.a1{animation:fadeUp .55s .05s ease both;}
.a2{animation:fadeUp .55s .12s ease both;}
.a3{animation:fadeUp .55s .19s ease both;}

/* Sidebar */
#sidebar{
  position:fixed;top:0;left:0;height:100%;width:260px;
  background:var(--card);border-right:1px solid var(--border2);
  z-index:100;display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
#sidebar.open{transform:translateX(0);}
#sidebar .sidebar-header{padding:24px 24px 20px;border-bottom:1px solid var(--border2);}
#sidebar .sidebar-header h1{font-family:var(--ff-disp);font-size:22px;color:var(--fg);letter-spacing:2px;}
#sidebar .sidebar-header p{font-family:var(--ff-mono);font-size:9px;color:var(--fg3);margin-top:4px;}
#sidebar nav{padding:20px 0;flex:1;overflow-y:auto;}
#sidebar nav .nav-title{font-family:var(--ff-mono);font-size:9px;letter-spacing:2px;color:var(--fg3);padding:0 20px 12px;text-transform:uppercase;}
#sidebar nav a{display:flex;align-items:center;padding:10px 20px;font-size:13px;color:var(--fg2);text-decoration:none;transition:all .2s;border-left:2px solid transparent;}
#sidebar nav a:hover{background:rgba(45,189,126,0.05);color:var(--fg);}
#sidebar nav a.active{background:rgba(45,189,126,0.08);border-left-color:var(--primary);color:var(--primary);}
#sidebar .sidebar-footer{padding:20px;border-top:1px solid var(--border2);font-family:var(--ff-mono);font-size:9px;color:var(--fg3);text-align:center;}

/* Overlay */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:90;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;backdrop-filter:blur(4px);}
#overlay.show{opacity:1;visibility:visible;}

/* Main Content */
.main-content{padding-left:0;transition:padding-left .3s;}
@media (min-width:768px){
  body{padding-left:260px;}
  #sidebar{transform:translateX(0);}
  #overlay{display:none;}
  #sidebarToggle{display:none;}
  #sidebarClose{display:none;}
}
.main-wrap{max-width:1000px;margin:0 auto;padding:24px 24px 60px;position:relative;z-index:10;}

/* Header Top */
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
#sidebarToggle{background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--fg);font-family:var(--ff-mono);font-size:12px;}

/* Banner */
.banner-wrap{border:1px solid var(--border2);margin-bottom:24px;background:var(--card);}
.banner-wrap img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;}

/* Terminal Search */
.terminal-box{border:1px solid var(--border2);overflow:hidden;margin-bottom:28px;}
.terminal-bar{background:var(--card2);padding:10px 16px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:8px;}
.terminal-dot{width:10px;height:10px;border-radius:50%;background:#ff5f56;}
.terminal-dot:nth-child(2){background:#ffbd2e;}
.terminal-dot:nth-child(3){background:#27c93f;}
.terminal-bar span{font-family:var(--ff-mono);font-size:9px;color:var(--fg3);margin-left:8px;}
.terminal-input{background:var(--bg2);padding:12px 16px;display:flex;align-items:center;gap:10px;}
.terminal-input .prompt{font-family:var(--ff-mono);font-size:12px;color:var(--primary);}
.terminal-input input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font-family:var(--ff-mono);font-size:12px;}
.terminal-input input::placeholder{color:var(--fg3);}

/* Card - KOTAK PERSEGI (border-radius:0) */
.card{background:var(--card);border:1px solid var(--border2);margin-bottom:12px;overflow:hidden;transition:all .2s;}
.card:hover{border-color:rgba(45,189,126,0.3);}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;background:var(--card);transition:background .2s;}
.card-header:hover{background:var(--card2);}
.card-header-left{display:flex;align-items:center;gap:12px;flex:1;}
.card-header-left .material-icons{color:var(--primary);transition:transform .2s;}
.card-header-left .material-icons.rotated{transform:rotate(180deg);}
.card-header-left h3{font-size:15px;font-weight:500;color:var(--fg);}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.tag{font-family:var(--ff-mono);font-size:8px;padding:3px 8px;background:var(--bg2);border:1px solid var(--border2);color:var(--fg3);letter-spacing:0.5px;}
.badge-method{font-family:var(--ff-mono);font-size:9px;font-weight:700;padding:4px 10px;flex-shrink:0;}
.badge-get{background:rgba(45,189,126,0.12);color:var(--primary);border:1px solid rgba(45,189,126,0.25);}
.badge-post{background:var(--post-bg);color:var(--post-c);border:1px solid var(--post-b);}
.card-body{display:none;padding:0 20px 20px;border-top:1px solid var(--border2);background:var(--card);}

/* Tab Methods */
.tab-container{display:flex;gap:0;border-bottom:1px solid var(--border2);margin-bottom:20px;}
.tab-btn{padding:10px 20px;font-family:var(--ff-mono);font-size:11px;font-weight:700;color:var(--fg3);background:transparent;border:none;cursor:pointer;transition:all .2s;position:relative;}
.tab-btn.active{color:var(--primary);}
.tab-btn.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--primary);}
.method-content{display:none;}
.method-content.active{display:block;}

/* Form Elements */
.param-group{margin-bottom:16px;}
.param-group label{display:block;font-family:var(--ff-mono);font-size:10px;font-weight:700;color:var(--fg2);margin-bottom:6px;text-transform:uppercase;}
.param-group input,.param-group select,.param-group textarea{width:100%;background:var(--bg2);border:1px solid var(--border2);padding:10px 12px;color:var(--fg);font-family:var(--ff-mono);font-size:11px;outline:none;transition:all .2s;}
.param-group input:focus,.param-group select:focus,.param-group textarea:focus{border-color:var(--primary);}
.param-group input::placeholder{color:var(--fg3);}
.param-group .desc{font-family:var(--ff-mono);font-size:9px;color:var(--fg3);margin-top:4px;}
.btn-execute{width:100%;background:var(--primary);border:none;padding:12px;color:#fff;font-family:var(--ff-mono);font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;}
.btn-execute:hover{background:var(--primary2);box-shadow:var(--glow);}
.btn-execute:disabled{opacity:.5;cursor:not-allowed;}
.button-group{display:flex;gap:12px;margin-top:16px;}
.button-group button{flex:1;}

/* Response Section */
.response-section{margin-top:20px;}
.response-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.response-status{font-family:var(--ff-mono);font-size:10px;padding:4px 12px;}
.response-status.ok{background:rgba(45,189,126,0.1);color:var(--primary);border:1px solid rgba(45,189,126,0.2);}
.response-status.err{background:rgba(248,113,113,0.1);color:var(--red);border:1px solid rgba(248,113,113,0.2);}
.response-timing{font-family:var(--ff-mono);font-size:9px;color:var(--fg3);background:var(--bg2);border:1px solid var(--border2);padding:4px 10px;}
.response-copy{font-family:var(--ff-mono);font-size:9px;color:var(--fg3);background:var(--bg2);border:1px solid var(--border2);padding:4px 12px;cursor:pointer;}
.response-box{background:var(--bg2);border:1px solid var(--border2);overflow:hidden;}
.response-box-header{padding:10px 14px;border-bottom:1px solid var(--border2);font-family:var(--ff-mono);font-size:9px;color:var(--fg3);text-transform:uppercase;}
.response-content{padding:14px;font-family:var(--ff-mono);font-size:11px;overflow-x:auto;max-height:300px;overflow-y:auto;}
.response-content pre{margin:0;white-space:pre-wrap;word-break:break-all;}

/* Code Block */
.code-block{background:var(--bg2);border:1px solid var(--border2);margin-top:16px;overflow:hidden;}
.code-header{padding:10px 14px;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center;}
.code-header span{font-family:var(--ff-mono);font-size:9px;color:var(--fg3);text-transform:uppercase;}
.code-copy{font-family:var(--ff-mono);font-size:9px;color:var(--fg3);background:none;border:none;cursor:pointer;}
.code-pre{padding:14px;font-family:var(--ff-mono);font-size:10px;white-space:pre-wrap;overflow-x:auto;line-height:1.6;}

/* Empty State */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;}
.empty-state .icon{font-family:var(--ff-disp);font-size:48px;color:var(--fg3);opacity:0.3;margin-bottom:12px;}
.empty-state .text{font-family:var(--ff-mono);font-size:10px;color:var(--fg3);}

/* Footer */
hr.sep{border:none;border-top:1px solid var(--border2);max-width:1000px;margin:0 auto;}
footer{background:var(--card);border-top:1px solid var(--border2);margin-top:20px;}
.footer-inner{max-width:1000px;margin:0 auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.footer-brand{font-family:var(--ff-disp);font-size:20px;color:var(--fg);letter-spacing:2px;}
.footer-copy{font-family:var(--ff-mono);font-size:9px;color:var(--fg3);}

/* No Results */
#noResults{display:none;text-align:center;padding:48px 24px;}
#noResults .icon{font-size:48px;opacity:0.3;margin-bottom:12px;}
#noResults .text{font-family:var(--ff-mono);font-size:10px;color:var(--fg3);}
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">loading</div>
</div>

<aside id="sidebar">
  <div class="sidebar-header">
    <h1>#BuildWithNeko</h1>
    <p>Downloader API</p>
  </div>
  <nav>
    <div class="nav-title">Get Started</div>
    <a href="#">Documentation</a>
    <a href="#">Contributors</a>
    <div class="nav-title" style="margin-top:16px;">Categories</div>
    <a href="#" class="active">Downloader</a>
    <a href="#">Random</a>
    <a href="#">Tools</a>
  </nav>
  <div class="sidebar-footer">
    <span>@oota_asik_sendiri</span>
  </div>
</aside>

<div id="overlay"></div>

<div class="main-content">
  <div class="main-wrap">
    
    <div class="header-top">
      <button id="sidebarToggle" class="material-icons">menu</button>
      <div></div>
    </div>

    <!-- BANNER -->
    <div class="banner-wrap a1">
      <img src="./assets/banner.jpg" alt="Banner" onerror="this.style.display='none'"/>
    </div>

    <!-- Terminal Search -->
    <div class="terminal-box a2">
      <div class="terminal-bar">
        <div class="terminal-dot"></div>
        <div class="terminal-dot"></div>
        <div class="terminal-dot"></div>
        <span>terminal — bash — search</span>
      </div>
      <div class="terminal-input">
        <span class="prompt">$</span>
        <input type="text" id="searchInput" placeholder="search endpoints...">
      </div>
    </div>

    <!-- Endpoints List -->
    <div id="ep-list"></div>
    <div id="noResults">
      <div class="icon">⌕</div>
      <div class="text">No endpoints found</div>
    </div>

  </div>
</div>

<hr class="sep"/>
<footer>
  <div class="footer-inner">
    <div>
      <div class="footer-brand" id="footer-name">BASE-SIMPLE</div>
      <div class="footer-copy">© <span id="yr"></span> <span id="footer-author">@oota_asik_sendiri</span></div>
    </div>
    <div class="footer-copy">REST API · express.js</div>
  </div>
</footer>

<script>
// Endpoints Data
const endpointsData = [
  { alias: "All In One Downloader v1", method: "GET/POST", methods: ["GET", "POST"], path: "/downloader/aio/v1", tags: ["JSON Response", "AIO", "All Platform"], body: { url: "https://instagram.com/..." }, contentType: "application/json", parameters: { required: [{ name: "url", description: "URL from any platform", type: "string", example: "https://instagram.com/..." }], optional: [] } },
  { alias: "All In One Downloader v2", method: "GET/POST", methods: ["GET", "POST"], path: "/downloader/aio/v2", tags: ["JSON Response", "AIO", "All Platform"], body: { url: "https://instagram.com/..." }, contentType: "application/json", parameters: { required: [{ name: "url", description: "URL from any platform", type: "string", example: "https://instagram.com/..." }], optional: [] } },
  { alias: "TikTok Downloader", method: "GET/POST", methods: ["GET", "POST"], path: "/downloader/tiktok", tags: ["Video Download", "Audio Download"], body: { url: "https://tiktok.com/..." }, contentType: "application/json", parameters: { required: [{ name: "url", description: "TikTok video URL", type: "string", example: "https://tiktok.com/@user/video/123" }], optional: [] } },
  { alias: "YouTube Downloader v1", method: "GET/POST", methods: ["GET", "POST"], path: "/downloader/youtube/v1", tags: ["Video Download", "Audio Download"], body: { url: "https://youtube.com/...", format: "mp3" }, contentType: "application/json", parameters: { required: [{ name: "url", description: "YouTube video URL", type: "string", example: "https://youtube.com/watch?v=..." }, { name: "format", description: "Format: 360,480,720,1080,mp3", type: "string", example: "mp3" }], optional: [] } },
  { alias: "Instagram Downloader", method: "GET/POST", methods: ["GET", "POST"], path: "/downloader/instagram", tags: ["Video Download", "Image Download"], body: { url: "https://instagram.com/..." }, contentType: "application/json", parameters: { required: [{ name: "url", description: "Instagram post/reel URL", type: "string", example: "https://instagram.com/p/..." }], optional: [] } },
  { alias: "Facebook Downloader", method: "GET/POST", methods: ["GET", "POST"], path: "/downloader/facebook", tags: ["Video Download"], body: { url: "https://facebook.com/..." }, contentType: "application/json", parameters: { required: [{ name: "url", description: "Facebook video URL", type: "string", example: "https://facebook.com/watch/..." }], optional: [] } },
  { alias: "Twitter/X Downloader", method: "GET/POST", methods: ["GET", "POST"], path: "/downloader/twitter", tags: ["Video Download", "Image Download"], body: { url: "https://x.com/..." }, contentType: "application/json", parameters: { required: [{ name: "url", description: "Twitter/X post URL", type: "string", example: "https://x.com/user/status/..." }], optional: [] } },
  { alias: "Spotify Downloader", method: "GET/POST", methods: ["GET", "POST"], path: "/downloader/spotify/v1", tags: ["Music Download"], body: { url: "https://open.spotify.com/..." }, contentType: "application/json", parameters: { required: [{ name: "url", description: "Spotify track URL", type: "string", example: "https://open.spotify.com/track/..." }], optional: [] } }
];

let currentResponse = null;

// Helper Functions
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Render Endpoints
function renderEndpoints(filter = '') {
  const container = document.getElementById('ep-list');
  const noResults = document.getElementById('noResults');
  const searchTerm = filter.toLowerCase();
  
  const filtered = endpointsData.filter(ep => 
    ep.alias.toLowerCase().includes(searchTerm) || 
    ep.path.toLowerCase().includes(searchTerm) ||
    ep.tags.some(t => t.toLowerCase().includes(searchTerm))
  );
  
  if (filtered.length === 0) {
    container.innerHTML = '';
    noResults.style.display = 'block';
    return;
  }
  
  noResults.style.display = 'none';
  container.innerHTML = filtered.map((ep, idx) => `
    <div class="card a${(idx % 3) + 1}" data-endpoint-idx="${idx}">
      <div class="card-header" onclick="toggleCard(${idx})">
        <div class="card-header-left">
          <span class="material-icons" id="card-icon-${idx}">expand_more</span>
          <div>
            <h3>${esc(ep.alias)}</h3>
            <div class="tags">
              ${ep.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}
            </div>
          </div>
        </div>
        <span class="badge-method ${ep.method === 'GET' ? 'badge-get' : 'badge-post'}">${ep.method}</span>
      </div>
      <div class="card-body" id="card-body-${idx}">
        <div class="tab-container">
          ${ep.methods.map(m => `<button class="tab-btn ${m === 'GET' ? 'active' : ''}" onclick="switchMethod(${idx}, '${m}')">${m}</button>`).join('')}
        </div>
        <div id="method-get-${idx}" class="method-content ${ep.methods.includes('GET') ? 'active' : ''}">
          ${ep.parameters?.required?.map(p => `
            <div class="param-group">
              <label>${esc(p.name)} ${p.example ? `<span style="color:var(--fg3);">(example: ${esc(p.example)})</span>` : ''}</label>
              <input type="text" name="${esc(p.name)}" placeholder="${esc(p.description || p.name)}" value="${esc(p.example || '')}" oninput="updateCurl(${idx})">
              ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ''}
            </div>
          `).join('')}
        </div>
        <div id="method-post-${idx}" class="method-content ${!ep.methods.includes('GET') ? 'active' : ''}">
          ${ep.parameters?.required?.map(p => `
            <div class="param-group">
              <label>${esc(p.name)} ${p.example ? `<span style="color:var(--fg3);">(example: ${esc(p.example)})</span>` : ''}</label>
              <input type="text" name="${esc(p.name)}" placeholder="${esc(p.description || p.name)}" value="${esc(p.example || '')}" oninput="updateCurl(${idx})">
              ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ''}
            </div>
          `).join('')}
          <div class="param-group">
            <label>Request Body (JSON)</label>
            <textarea name="body" rows="4" placeholder='${ep.body ? JSON.stringify(ep.body, null, 2) : '{"key": "value"}'}' oninput="updateCurl(${idx})">${ep.body ? JSON.stringify(ep.body, null, 2) : ''}</textarea>
          </div>
        </div>
        <div class="button-group">
          <button class="btn-execute" onclick="executeRequest(${idx})"><span class="material-icons" style="font-size:14px;">play_arrow</span> EXECUTE</button>
          <button class="btn-execute" style="background:var(--card2);color:var(--fg2);" onclick="clearResponse(${idx})"><span class="material-icons" style="font-size:14px;">clear</span> CLEAR</button>
        </div>
        <div class="response-section" id="response-${idx}" style="display:none;">
          <div class="response-header">
            <span class="response-status ok" id="resp-status-${idx}">200 OK</span>
            <span class="response-timing" id="resp-time-${idx}">—ms</span>
            <button class="response-copy" onclick="copyResponse(${idx})">Copy</button>
          </div>
          <div class="response-box">
            <div class="response-box-header">Response</div>
            <div class="response-content" id="resp-content-${idx}">
              <pre>Send a request to see response...</pre>
            </div>
          </div>
        </div>
        <div class="code-block" id="curl-block-${idx}">
          <div class="code-header">
            <span>cURL Command</span>
            <button class="code-copy" onclick="copyCurl(${idx})">copy</button>
          </div>
          <div class="code-pre" id="curl-pre-${idx}">curl -X GET "${window.location.origin}${ep.path}"</div>
        </div>
      </div>
    </div>
  `).join('');
  
  endpointsData.forEach((_, idx) => updateCurl(idx));
}

// Toggle Card
function toggleCard(idx) {
  const body = document.getElementById(`card-body-${idx}`);
  const icon = document.getElementById(`card-icon-${idx}`);
  if (body.style.display === 'none' || !body.style.display) {
    body.style.display = 'block';
    icon.classList.remove('rotated');
  } else {
    body.style.display = 'none';
    icon.classList.add('rotated');
  }
}

// Switch Method
function switchMethod(idx, method) {
  const getContent = document.getElementById(`method-get-${idx}`);
  const postContent = document.getElementById(`method-post-${idx}`);
  const tabs = document.querySelectorAll(`#card-body-${idx} .tab-btn`);
  
  tabs.forEach(tab => {
    if (tab.textContent === method) {
      tab.classList.add('active');
    } else {
      tab.classList.remove('active');
    }
  });
  
  if (method === 'GET') {
    getContent.classList.add('active');
    postContent.classList.remove('active');
  } else {
    getContent.classList.add('active');
    postContent.classList.remove('active');
  }
  updateCurl(idx);
}

// Build Curl Command
function buildCurl(idx) {
  const ep = endpointsData[idx];
  const method = document.querySelector(`#card-body-${idx} .tab-btn.active`)?.textContent || 'GET';
  let url = window.location.origin + ep.path;
  const params = [];
  
  if (method === 'GET') {
    const inputs = document.querySelectorAll(`#method-get-${idx} input`);
    inputs.forEach(input => {
      if (input.value) params.push(`${encodeURIComponent(input.name)}=${encodeURIComponent(input.value)}`);
    });
    if (params.length) url += '?' + params.join('&');
    return `curl -X GET "${url}"`;
  } else {
    const inputs = document.querySelectorAll(`#method-post-${idx} input`);
    const bodyObj = {};
    inputs.forEach(input => { if (input.value) bodyObj[input.name] = input.value; });
    const bodyTextarea = document.querySelector(`#method-post-${idx} textarea[name="body"]`);
    let bodyStr = '';
    if (bodyTextarea && bodyTextarea.value.trim()) {
      try { bodyStr = JSON.stringify(JSON.parse(bodyTextarea.value)); } catch(e) { bodyStr = bodyTextarea.value; }
    } else if (Object.keys(bodyObj).length) {
      bodyStr = JSON.stringify(bodyObj);
    }
    return `curl -X POST "${url}" \\\n  -H "Content-Type: application/json" \\\n  -d '${bodyStr}'`;
  }
}

// Update Curl Display
function updateCurl(idx) {
  const curlPre = document.getElementById(`curl-pre-${idx}`);
  if (curlPre) curlPre.textContent = buildCurl(idx);
}

// Copy Curl
function copyCurl(idx) {
  const curlPre = document.getElementById(`curl-pre-${idx}`);
  if (curlPre) {
    navigator.clipboard.writeText(curlPre.textContent);
    const btn = curlPre.parentElement.querySelector('.code-copy');
    const original = btn.textContent;
    btn.textContent = '✓';
    setTimeout(() => btn.textContent = original, 1500);
  }
}

// Copy Response
function copyResponse(idx) {
  const content = document.getElementById(`resp-content-${idx}`);
  if (content && currentResponse) {
    navigator.clipboard.writeText(JSON.stringify(currentResponse, null, 2));
    const btn = document.querySelector(`#response-${idx} .response-copy`);
    const original = btn.textContent;
    btn.textContent = '✓';
    setTimeout(() => btn.textContent = original, 1500);
  }
}

// Clear Response
function clearResponse(idx) {
  const respSection = document.getElementById(`response-${idx}`);
  if (respSection) respSection.style.display = 'none';
  currentResponse = null;
}

// Execute Request
async function executeRequest(idx) {
  const ep = endpointsData[idx];
  const method = document.querySelector(`#card-body-${idx} .tab-btn.active`)?.textContent || 'GET';
  let url = window.location.origin + ep.path;
  const startTime = Date.now();
  
  const respSection = document.getElementById(`response-${idx}`);
  const respContent = document.getElementById(`resp-content-${idx}`);
  const respStatus = document.getElementById(`resp-status-${idx}`);
  const respTime = document.getElementById(`resp-time-${idx}`);
  
  respContent.innerHTML = '<pre>Loading...</pre>';
  respSection.style.display = 'block';
  
  try {
    let response;
    if (method === 'GET') {
      const params = [];
      const inputs = document.querySelectorAll(`#method-get-${idx} input`);
      inputs.forEach(input => { if (input.value) params.push(`${encodeURIComponent(input.name)}=${encodeURIComponent(input.value)}`); });
      if (params.length) url += '?' + params.join('&');
      response = await fetch(url);
    } else {
      const inputs = document.querySelectorAll(`#method-post-${idx} input`);
      const bodyObj = {};
      inputs.forEach(input => { if (input.value) bodyObj[input.name] = input.value; });
      const bodyTextarea = document.querySelector(`#method-post-${idx} textarea[name="body"]`);
      let body = null;
      if (bodyTextarea && bodyTextarea.value.trim()) {
        try { body = JSON.parse(bodyTextarea.value); } catch(e) { body = bodyTextarea.value; }
      } else if (Object.keys(bodyObj).length) {
        body = bodyObj;
      }
      response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
    }
    
    const ms = Date.now() - startTime;
    const isOk = response.ok;
    let data;
    const contentType = response.headers.get('content-type');
    if (contentType && contentType.includes('application/json')) {
      data = await response.json();
    } else {
      data = await response.text();
    }
    
    currentResponse = data;
    respStatus.textContent = `${response.status} ${response.statusText}`;
    respStatus.className = `response-status ${isOk ? 'ok' : 'err'}`;
    respTime.textContent = `${ms}ms`;
    
    const jsonStr = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
    respContent.innerHTML = `<pre>${esc(jsonStr)}</pre>`;
    
    updateCurl(idx);
  } catch (error) {
    respStatus.textContent = '500 Error';
    respStatus.className = 'response-status err';
    respTime.textContent = `${Date.now() - startTime}ms`;
    respContent.innerHTML = `<pre>Error: ${esc(error.message)}</pre>`;
  }
}

// Search Filter
function setupSearch() {
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => renderEndpoints(e.target.value));
  }
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  renderEndpoints('');
  setupSearch();
  document.getElementById('yr').textContent = new Date().getFullYear();
  
  // Sidebar toggle
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const toggleBtn = document.getElementById('sidebarToggle');
  
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.add('open');
      overlay.classList.add('show');
    });
  }
  if (overlay) {
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    });
  }
  
  // Loader
  setTimeout(() => {
    const loader = document.getElementById('loader');
    if (loader) loader.classList.add('out');
  }, 500);
});

// Expose globals
window.toggleCard = toggleCard;
window.switchMethod = switchMethod;
window.executeRequest = executeRequest;
window.clearResponse = clearResponse;
window.updateCurl = updateCurl;
window.copyCurl = copyCurl;
window.copyResponse = copyResponse;
</script>
</body>
</html>
